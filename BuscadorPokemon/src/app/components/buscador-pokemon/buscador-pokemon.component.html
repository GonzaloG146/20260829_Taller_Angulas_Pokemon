<form (ngSubmit)="buscarPokemon()" #pokemonForm="ngForm">

    <div>
        <label>Inserte el nombre del Pokemon </label>
        <input type="text" [(ngModel)]="nombrePokemonInput" name="nombrePokemon"
            placeholder="Ej. pikachu , charmander, bulbasaur" required />
    </div>

    <button type="submit">Buscar</button>

</form>

<div id="resultadoPokemon">

    @if (Pokemon(); as p) {

    <div>
        <h2>{{ p.name }}</h2>

        <img [src]="p.image" [alt]="p.name">

        <p>
            <strong>Elementos</strong>
            {{ p.type }}
        </p>
    </div>

    } @else {

    <p>Error con aura</p>

    }

</div>
